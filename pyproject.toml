[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catch-jax"
version = "0.1.0"
description = "JAX implementation of the Catch reinforcement learning environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catch_jax"]

[dependency-groups]
dev = [
    "pytest",
    "numpy",
    "ruff>=0.17.2",
    "pyrefly>=1.4.0",
]
# For benchmark_dqn.py: uv run --group benchmark python benchmark_dqn.py
benchmark = ["optax", "matplotlib", "numpy", "pillow"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["tests/_reference_*.py"]

[tool.pyrefly]
project-includes = ["src"]
