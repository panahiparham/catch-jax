[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catch-jax"
version = "0.1.0"
description = "JAX implementation of the Catch reinforcement learning environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catch_jax"]

[dependency-groups]
dev = ["pytest", "numpy"]
# For benchmark_dqn.py: uv run --group benchmark python benchmark_dqn.py
benchmark = ["optax", "matplotlib", "numpy", "pillow"]
